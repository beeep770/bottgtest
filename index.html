<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeymBots Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: white; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-btn.active { color: #ef4444; }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <div class="sticky top-0 bg-[#0a0a0a] z-40 px-4 pt-4 pb-2">
        <div class="flex items-center text-gray-400 text-xs mb-3">
            <i class="fa-solid fa-truck-fast mr-2 text-red-500"></i>
            <span>TeymBots Logistics • Прямая доставка из Китая</span>
        </div>
        <div class="relative">
            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-500"></i>
            <input type="text" id="search-input" placeholder="Поиск кроссовок, брендов..." 
                   class="w-full bg-[#1a1a1a] text-white rounded-xl py-2.5 pl-10 pr-4 outline-none border border-gray-800 focus:border-red-500 transition-colors">
        </div>
    </div>

    <!-- Views -->
    <main id="main-content" class="px-4 mt-2">
        
        <!-- Home View -->
        <div id="home-view" class="view-section">
            <h2 class="text-xl font-bold mb-4 mt-2">Каталог</h2>
            <div id="products-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Cart View -->
        <div id="cart-view" class="view-section hidden">
            <h2 class="text-xl font-bold mb-4 mt-2">Корзина</h2>
            <div id="cart-items" class="space-y-3 mb-6"></div>
            <div id="cart-summary" class="bg-[#1a1a1a] p-4 rounded-xl hidden">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-400">Товары</span>
                    <span id="cart-total-price" class="font-bold">0 ₽</span>
                </div>
                <button onclick="showPayment()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl mt-2 transition-colors">
                    Оплатить в Telegram
                </button>
            </div>
            <div id="empty-cart" class="text-center text-gray-500 mt-10">
                <i class="fa-solid fa-cart-shopping text-4xl mb-3 opacity-50"></i>
                <p>Ваша корзина пуста</p>
            </div>
        </div>

        <!-- Profile View -->
        <div id="profile-view" class="view-section hidden">
            <div class="flex items-center space-x-4 bg-[#1a1a1a] p-4 rounded-xl mb-6">
                <div onclick="toggleAdmin()" class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-xl font-bold cursor-pointer">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 id="user-name" class="font-bold text-lg">Покупатель</h2>
                    <p class="text-sm text-gray-400">ID: <span id="user-id">...</span></p>
                </div>
            </div>

            <button id="admin-btn" onclick="switchView('admin-view')" class="hidden w-full bg-gray-800 p-4 rounded-xl flex items-center justify-between mb-6">
                <div class="flex items-center text-red-500"><i class="fa-solid fa-gear mr-3"></i> Управление магазином</div>
                <i class="fa-solid fa-chevron-right text-gray-500 text-sm"></i>
            </button>

            <h3 class="font-bold mb-3">Мои заказы</h3>
            <div id="orders-list" class="space-y-3 mb-6"></div>

            <div class="space-y-2">
                <button onclick="openSupport()" class="w-full bg-[#1a1a1a] p-4 rounded-xl flex items-center justify-between">
                    <div class="flex items-center"><i class="fa-solid fa-headset mr-3 text-blue-400"></i> Служба поддержки</div>
                    <i class="fa-solid fa-chevron-right text-gray-500 text-sm"></i>
                </button>
                <button onclick="tg.showAlert('TeymBots Store v1.0\nРазработано специально для доставки оригинальной обуви из Китая.')" class="w-full bg-[#1a1a1a] p-4 rounded-xl flex items-center justify-between">
                    <div class="flex items-center"><i class="fa-solid fa-circle-info mr-3 text-gray-400"></i> О приложении</div>
                    <i class="fa-solid fa-chevron-right text-gray-500 text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Admin View -->
        <div id="admin-view" class="view-section hidden">
            <div class="flex items-center mb-6">
                <button onclick="switchView('profile-view')" class="mr-4 text-gray-400"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold">Управление магазином</h2>
            </div>
            <div class="bg-[#1a1a1a] p-4 rounded-xl space-y-3">
                <input type="text" id="add-title" placeholder="Название модели" class="w-full bg-[#0a0a0a] p-3 rounded-lg outline-none border border-gray-800">
                <input type="number" id="add-price" placeholder="Цена (₽)" class="w-full bg-[#0a0a0a] p-3 rounded-lg outline-none border border-gray-800">
                <textarea id="add-images" placeholder="Ссылки на фото (через запятую)" class="w-full bg-[#0a0a0a] p-3 rounded-lg outline-none border border-gray-800 h-20"></textarea>
                <input type="text" id="add-sizes" placeholder="Размеры (через запятую, напр: 39,40,41)" class="w-full bg-[#0a0a0a] p-3 rounded-lg outline-none border border-gray-800">
                <button onclick="addProduct()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg mt-2">Добавить товар</button>
            </div>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-[#0a0a0a] z-50 hidden flex-col overflow-y-auto">
        <button onclick="closeProduct()" class="absolute top-4 left-4 z-10 w-10 h-10 bg-black/50 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
        
        <div class="relative h-72 bg-white flex items-center justify-center">
            <img id="modal-img" src="" class="w-full h-full object-contain p-4">
            <button onclick="prevImage()" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-black/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="nextImage()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-black/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
            <div id="img-counter" class="absolute bottom-2 bg-black/50 px-2 py-1 rounded-md text-xs">1/1</div>
        </div>

        <div class="p-4 flex-1">
            <h2 id="modal-title" class="text-2xl font-bold mb-2">Название</h2>
            <div id="modal-price" class="text-xl text-red-500 font-bold mb-6">0 ₽</div>
            
            <h3 class="font-bold mb-3">Выберите размер</h3>
            <div id="modal-sizes" class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-2"></div>

            <div class="bg-[#1a1a1a] rounded-xl p-4 mb-6">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold">Отзывы</h3>
                    <button onclick="addReview()" class="text-red-500 text-sm">Оставить отзыв</button>
                </div>
                <div id="modal-reviews" class="space-y-3 text-sm text-gray-300"></div>
            </div>
        </div>

        <div class="p-4 bg-[#0a0a0a] border-t border-gray-800 pb-8">
            <button onclick="addToCart()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-3 rounded-xl transition-colors">В корзину</button>
        </div>
    </div>

    <!-- Payment Modal (Test) -->
    <div id="payment-modal" class="fixed inset-0 bg-black/90 z-[60] hidden flex-col items-center justify-center p-4">
        <div class="bg-[#1a1a1a] p-6 rounded-xl w-full max-w-sm text-center">
            <h3 class="text-xl font-bold mb-4">Оплата заказа</h3>
            <div class="bg-white p-2 rounded-lg inline-block mb-4">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=SBPTeymBotsTest" class="w-48 h-48">
            </div>
            <p class="text-sm text-gray-400 mb-6">Отсканируйте QR-код через приложение вашего банка (Тестовый режим)</p>
            <button onclick="confirmPayment()" class="w-full bg-green-600 font-bold py-3 rounded-xl mb-3">Я оплатил</button>
            <button onclick="closePayment()" class="w-full bg-gray-700 py-3 rounded-xl">Отмена</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-[#111] border-t border-gray-800 flex justify-around py-3 z-30 pb-6">
        <button onclick="switchView('home-view', this)" class="nav-btn active flex flex-col items-center w-16 text-gray-500">
            <i class="fa-solid fa-house text-xl mb-1"></i>
            <span class="text-[10px]">Главная</span>
        </button>
        <button onclick="switchView('cart-view', this)" class="nav-btn flex flex-col items-center w-16 text-gray-500">
            <div class="relative">
                <i class="fa-solid fa-cart-shopping text-xl mb-1"></i>
                <span id="cart-badge" class="absolute -top-1 -right-2 bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
            </div>
            <span class="text-[10px]">Корзина</span>
        </button>
        <button onclick="switchView('profile-view', this)" class="nav-btn flex flex-col items-center w-16 text-gray-500">
            <i class="fa-regular fa-user text-xl mb-1"></i>
            <span class="text-[10px]">Профиль</span>
        </button>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setBackgroundColor('#0a0a0a');
        tg.setHeaderColor('#0a0a0a');

        // State
        let products = JSON.parse(localStorage.getItem('teym_products')) || [];
        let cart = JSON.parse(localStorage.getItem('teym_cart')) || [];
        let orders = JSON.parse(localStorage.getItem('teym_orders')) || [];
        
        let currentProduct = null;
        let currentImageIndex = 0;
        let selectedSize = null;

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            // Set user data
            if(tg.initDataUnsafe?.user) {
                document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
                document.getElementById('user-id').innerText = tg.initDataUnsafe.user.id;
                if(tg.initDataUnsafe.user.id.toString() === '123456789') { // Replace with your ID
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
            }
            renderProducts();
            updateCartBadge();
            renderOrders();
        });

        // Navigation
        function switchView(viewId, btnElement = null) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            if(btnElement) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            if(viewId === 'cart-view') renderCart();
        }

        // Easter Egg for Admin
        function toggleAdmin() {
            document.getElementById('admin-btn').classList.toggle('hidden');
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Render Products
        function renderProducts(items = products) {
            const grid = document.getElementById('products-grid');
            if(items.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 py-10">Товаров пока нет</div>';
                return;
            }
            grid.innerHTML = items.map(p => `
                <div onclick="openProduct(${p.id})" class="bg-[#1a1a1a] rounded-xl overflow-hidden cursor-pointer">
                    <div class="h-32 bg-white flex items-center justify-center">
                        <img src="${p.images[0]}" class="h-full object-contain p-2">
                    </div>
                    <div class="p-3">
                        <h3 class="text-sm font-bold truncate">${p.title}</h3>
                        <p class="text-red-500 font-bold text-sm mt-1">${p.price} ₽</p>
                    </div>
                </div>
            `).join('');
        }

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderProducts(products.filter(p => p.title.toLowerCase().includes(q)));
        });

        // Admin: Add Product
        function addProduct() {
            const title = document.getElementById('add-title').value;
            const price = document.getElementById('add-price').value;
            const imagesRaw = document.getElementById('add-images').value;
            const sizesRaw = document.getElementById('add-sizes').value;

            if(!title || !price || !imagesRaw) return tg.showAlert('Заполните основные поля');

            const newProduct = {
                id: Date.now(),
                title,
                price: parseInt(price),
                images: imagesRaw.split(',').map(s => s.trim()),
                sizes: sizesRaw ? sizesRaw.split(',').map(s => s.trim()) : ['39','40','41','42'],
                reviews: []
            };

            products.push(newProduct);
            localStorage.setItem('teym_products', JSON.stringify(products));
            
            document.getElementById('add-title').value = '';
            document.getElementById('add-price').value = '';
            document.getElementById('add-images').value = '';
            document.getElementById('add-sizes').value = '';
            
            renderProducts();
            switchView('home-view', document.querySelectorAll('.nav-btn')[0]);
            tg.showAlert('Товар успешно добавлен!');
        }

        // Product Modal Logic
        function openProduct(id) {
            currentProduct = products.find(p => p.id === id);
            currentImageIndex = 0;
            selectedSize = null;
            
            updateModalImage();
            document.getElementById('modal-title').innerText = currentProduct.title;
            document.getElementById('modal-price').innerText = currentProduct.price + ' ₽';
            
            const sizesHtml = currentProduct.sizes.map(s => 
                `<button onclick="selectSize(this, '${s}')" class="size-btn px-4 py-2 bg-[#2a2a2a] rounded-lg border border-transparent whitespace-nowrap">${s}</button>`
            ).join('');
            document.getElementById('modal-sizes').innerHTML = sizesHtml;
            
            renderReviews();
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        }

        function closeProduct() {
            document.getElementById('product-modal').classList.add('hidden');
            document.getElementById('product-modal').classList.remove('flex');
        }

        function updateModalImage() {
            document.getElementById('modal-img').src = currentProduct.images[currentImageIndex];
            document.getElementById('img-counter').innerText = `${currentImageIndex + 1}/${currentProduct.images.length}`;
        }

        function prevImage() {
            if(currentImageIndex > 0) { currentImageIndex--; updateModalImage(); }
        }

        function nextImage() {
            if(currentImageIndex < currentProduct.images.length - 1) { currentImageIndex++; updateModalImage(); }
        }

        function selectSize(btn, size) {
            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.remove('border-red-500', 'text-red-500');
            });
            btn.classList.add('border-red-500', 'text-red-500');
            selectedSize = size;
            tg.HapticFeedback.selectionChanged();
        }

        // Reviews
        function renderReviews() {
            const cont = document.getElementById('modal-reviews');
            if(!currentProduct.reviews || currentProduct.reviews.length === 0) {
                cont.innerHTML = '<p class="text-gray-500 italic">Пока нет отзывов. Будьте первым!</p>';
                return;
            }
            cont.innerHTML = currentProduct.reviews.map(r => 
                `<div class="border-b border-gray-800 pb-2"><span class="font-bold text-white">${r.author}:</span> ${r.text}</div>`
            ).join('');
        }

        function addReview() {
            const text = prompt('Напишите ваш отзыв:');
            if(text) {
                if(!currentProduct.reviews) currentProduct.reviews = [];
                currentProduct.reviews.push({ author: tg.initDataUnsafe?.user?.first_name || 'Покупатель', text });
                localStorage.setItem('teym_products', JSON.stringify(products));
                renderReviews();
            }
        }

        // Cart Logic
        function addToCart() {
            if(!selectedSize) return tg.showAlert('Пожалуйста, выберите размер');
            
            cart.push({ ...currentProduct, cartId: Date.now(), selectedSize });
            localStorage.setItem('teym_cart', JSON.stringify(cart));
            
            updateCartBadge();
            closeProduct();
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Товар добавлен в корзину!');
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            if(cart.length > 0) {
                badge.innerText = cart.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderCart() {
            const cont = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const empty = document.getElementById('empty-cart');

            if(cart.length === 0) {
                cont.innerHTML = '';
                summary.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            summary.classList.remove('hidden');

            let total = 0;
            cont.innerHTML = cart.map(item => {
                total += item.price;
                return `
                <div class="flex bg-[#1a1a1a] p-3 rounded-xl relative">
                    <div class="w-20 h-20 bg-white rounded-lg flex items-center justify-center shrink-0">
                        <img src="${item.images[0]}" class="w-full h-full object-contain p-1">
                    </div>
                    <div class="ml-3 flex-1">
                        <h3 class="text-sm font-bold pr-6">${item.title}</h3>
                        <p class="text-xs text-gray-400 mt-1">Размер: ${item.selectedSize}</p>
                        <p class="text-red-500 font-bold mt-1">${item.price} ₽</p>
                    </div>
                    <button onclick="removeFromCart(${item.cartId})" class="absolute top-3 right-3 text-gray-500 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                </div>
                `;
            }).join('');
            
            document.getElementById('cart-total-price').innerText = total + ' ₽';
        }

        function removeFromCart(cartId) {
            cart = cart.filter(c => c.cartId !== cartId);
            localStorage.setItem('teym_cart', JSON.stringify(cart));
            updateCartBadge();
            renderCart();
            tg.HapticFeedback.impactOccurred('light');
        }

        // Payment & Orders
        function showPayment() {
            document.getElementById('payment-modal').classList.remove('hidden');
            document.getElementById('payment-modal').classList.add('flex');
        }
        
        function closePayment() {
            document.getElementById('payment-modal').classList.add('hidden');
            document.getElementById('payment-modal').classList.remove('flex');
        }

        function confirmPayment() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 10000),
                date: new Date().toLocaleDateString(),
                items: cart,
                total: total,
                status: 'В пути'
            };

            orders.unshift(newOrder);
            localStorage.setItem('teym_orders', JSON.stringify(orders));
            
            // Send data to Telegram Bot
            tg.sendData(JSON.stringify({ items: cart, totalPrice: total }));
            
            cart = [];
            localStorage.setItem('teym_cart', JSON.stringify(cart));
            
            updateCartBadge();
            renderOrders();
            closePayment();
            switchView('profile-view', document.querySelectorAll('.nav-btn')[2]);
            tg.showAlert('Оплата прошла успешно! Заказ оформлен.');
        }

        function renderOrders() {
            const cont = document.getElementById('orders-list');
            if(orders.length === 0) {
                cont.innerHTML = '<p class="text-gray-500 text-sm">У вас пока нет заказов</p>';
                return;
            }

            cont.innerHTML = orders.map(o => `
                <div class="bg-[#1a1a1a] p-4 rounded-xl border border-gray-800">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">
                        <span class="font-bold text-sm">${o.id}</span>
                        <span class="text-xs bg-red-900/30 text-red-500 px-2 py-1 rounded">${o.status}</span>
                    </div>
                    <div class="space-y-2">
                        ${o.items.map(item => `
                            <div class="flex items-center text-sm">
                                <div class="w-10 h-10 bg-white rounded flex items-center justify-center mr-3">
                                    <img src="${item.images[0]}" class="w-full h-full object-contain p-0.5">
                                </div>
                                <div class="flex-1 truncate">${item.title} (Размер: ${item.selectedSize})</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="mt-3 text-right font-bold text-red-500">${o.total} ₽</div>
                </div>
            `).join('');
        }

        function openSupport() {
            tg.openTelegramLink('https://t.me/durov'); // Замени на свой username
        }
    </script>
</body>
</html>
